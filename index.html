<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        canvas {
            display: block;
        }

        #intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            transition: opacity 1.2s ease;
            cursor: pointer;
            user-select: none;
            flex-direction: column;
        }
        #intro-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #intro-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 20% 30%, rgba(255, 255, 255, 0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(255, 255, 255, 0.25), transparent),
                radial-gradient(2px 2px at 80% 80%, rgba(255, 255, 255, 0.15), transparent),
                radial-gradient(2px 2px at 10% 90%, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(2px 2px at 90% 10%, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(1px 1px at 30% 50%, rgba(255, 255, 255, 0.3), transparent),
                radial-gradient(1px 1px at 70% 40%, rgba(255, 255, 255, 0.25), transparent),
                radial-gradient(1px 1px at 50% 10%, rgba(255, 255, 255, 0.2), transparent);
            pointer-events: none;
        }

        .envelope-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
        }
        .envelope-wrapper.open {
            animation: envelopeOpen 1.2s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
        }

        @keyframes envelopeOpen {
            0% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
            40% {
                transform: scale(1.05) translateY(-30px);
                opacity: 1;
            }
            100% {
                transform: scale(1.2) translateY(-120px) rotate(2deg);
                opacity: 0;
            }
        }

        .envelope {
            position: relative;
            width: 440px;
            height: 300px;
            background: linear-gradient(160deg, #fff5f7 0%, #fce4ec 45%, #f8e8ed 100%);
            border-radius: 12px;
            box-shadow:
                0 30px 80px rgba(255, 50, 150, 0.25),
                0 0 100px rgba(255, 50, 150, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            overflow: visible;
            transition: transform 0.3s ease;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 152px;
            background: linear-gradient(175deg, #f8bbd0 0%, #f48fb1 60%, #ec8cac 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-bottom: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 -8px 20px rgba(233, 30, 99, 0.08);
            transition: transform 0.8s cubic-bezier(0.34, 1.2, 0.64, 1), clip-path 0.8s ease;
            transform-origin: top center;
            z-index: 3;
        }
        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(-180deg) translateY(-10px);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }

        .envelope-body {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 185px;
            padding: 20px 35px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #fce4ec 0%, #fff5f7 100%);
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 1;
            overflow: hidden;
        }

        .heart-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 52px;
            filter: drop-shadow(0 0 30px rgba(233, 30, 99, 0.4));
            animation: pulseSeal 2.2s ease-in-out infinite;
            z-index: 2;
            line-height: 1;
            pointer-events: none;
            transition: all 0.6s ease;
        }
        .envelope-wrapper.open .heart-seal {
            transform: translate(-50%, -80%) scale(0.5);
            opacity: 0;
        }

        @keyframes pulseSeal {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                filter: drop-shadow(0 0 30px rgba(233, 30, 99, 0.4));
            }
            50% {
                transform: translate(-50%, -50%) scale(1.08);
                filter: drop-shadow(0 0 50px rgba(233, 30, 99, 0.6));
            }
        }

        .letter-content {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 10px;
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            transition: all 0.8s cubic-bezier(0.34, 1.2, 0.64, 1) 0.2s;
        }
        .envelope-wrapper.open .letter-content {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .letter-content .salutation {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-style: italic;
            font-size: 20px;
            color: #880e4f;
            letter-spacing: 0.5px;
            opacity: 0.85;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
            white-space: nowrap;
        }
        .letter-content .salutation strong {
            font-size: 24px;
            color: #ffffff;
            font-weight: 700;
            text-shadow:
                0 0 5px #fff,
                0 0 12px #ff66aa,
                0 0 24px #ff3399,
                0 0 45px rgba(255, 51, 153, 0.9);
            animation: textGlow 2s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% {
                filter: brightness(1);
                text-shadow:
                    0 0 5px #fff,
                    0 0 12px #ff66aa,
                    0 0 24px #ff3399,
                    0 0 45px rgba(255, 51, 153, 0.75);
            }
            50% {
                filter: brightness(1.25);
                text-shadow:
                    0 0 7px #fff,
                    0 0 18px #ff99cc,
                    0 0 35px #ff3399,
                    0 0 65px rgba(255, 51, 153, 0.95);
            }
        }
        .letter-content .divider {
            display: inline-block;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e91e63, transparent);
            margin: 8px auto 6px;
            border-radius: 2px;
            opacity: 0.4;
        }
        .letter-content .sub-line {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 14px;
            color: #ad1457;
            opacity: 0.6;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .envelope-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(233, 30, 99, 0.08);
            border-radius: 4px;
            pointer-events: none;
            z-index: 4;
        }
        .envelope-corner.tl {
            top: 12px;
            left: 12px;
            border-right: none;
            border-bottom: none;
        }
        .envelope-corner.tr {
            top: 12px;
            right: 12px;
            border-left: none;
            border-bottom: none;
        }
        .envelope-corner.bl {
            bottom: 12px;
            left: 12px;
            border-right: none;
            border-top: none;
        }
        .envelope-corner.br {
            bottom: 12px;
            right: 12px;
            border-left: none;
            border-top: none;
        }

        .click-hint {
            margin-top: 28px;
            font-size: 16px;
            letter-spacing: 3px;
            color: rgba(255, 200, 230, 0.6);
            font-weight: 300;
            text-shadow: 0 0 30px rgba(255, 50, 150, 0.15);
            animation: pulseHint 2.5s ease-in-out infinite;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 28px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            transition: opacity 0.4s ease;
            white-space: nowrap;
        }
        .envelope-wrapper.open .click-hint {
            opacity: 0;
        }

        @keyframes pulseHint {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        .envelope-glow {
            position: absolute;
            inset: -40px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 50, 150, 0.08) 0%, transparent 70%);
            pointer-events: none;
            animation: glowRotate 8s linear infinite;
        }
        @keyframes glowRotate {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.1);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 520px) {
            .envelope {
                width: 88vw;
                height: calc(88vw * 0.68);
                max-width: 400px;
                max-height: 272px;
            }
            .envelope-flap {
                height: 50%;
            }
            .envelope-body {
                height: 55%;
                padding: 12px 16px 16px;
            }
            .heart-seal {
                font-size: 38px;
            }
            .letter-content .salutation {
                font-size: 15px;
            }
            .letter-content .salutation strong {
                font-size: 18px;
            }
            .letter-content .sub-line {
                font-size: 11px;
                letter-spacing: 1.5px;
            }
            .click-hint {
                font-size: 13px;
                padding: 6px 16px;
                margin-top: 18px;
                letter-spacing: 2px;
            }
            .envelope-corner {
                display: none;
            }
            @keyframes envelopeOpen {
                0% {
                    transform: scale(1) translateY(0);
                    opacity: 1;
                }
                40% {
                    transform: scale(1.03) translateY(-20px);
                    opacity: 1;
                }
                100% {
                    transform: scale(1.1) translateY(-80px) rotate(2deg);
                    opacity: 0;
                }
            }
        }

        @media (max-width: 420px) {
            .envelope {
                width: 92vw;
                height: calc(92vw * 0.68);
                max-width: 340px;
                max-height: 231px;
            }
            .heart-seal {
                font-size: 30px;
            }
            .letter-content .salutation {
                font-size: 13px;
            }
            .letter-content .salutation strong {
                font-size: 15px;
            }
            .letter-content .sub-line {
                font-size: 10px;
                letter-spacing: 1px;
            }
            .click-hint {
                font-size: 11px;
                padding: 5px 12px;
                margin-top: 14px;
                letter-spacing: 1.5px;
            }
        }

        @media (max-width: 360px) {
            .letter-content .salutation {
                font-size: 11px;
            }
            .letter-content .salutation strong {
                font-size: 13px;
            }
            .letter-content .sub-line {
                font-size: 9px;
            }
            .click-hint {
                font-size: 10px;
                padding: 4px 10px;
            }
            .heart-seal {
                font-size: 24px;
            }
        }

        /* --- Player & Zoom Controls --- */
        .controls {
            position: fixed;
            bottom: 28px;
            z-index: 15;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .controls-left {
            left: 28px;
            flex-direction: column;
            gap: 8px;
        }
        .controls-right {
            right: 28px;
            flex-direction: row;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 20px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            user-select: none;
        }
        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.05);
        }
        .ctrl-btn:active {
            transform: scale(0.94);
        }

        .ctrl-btn.zoom-in {
            font-size: 26px;
            line-height: 1;
        }
        .ctrl-btn.zoom-out {
            font-size: 26px;
            line-height: 1;
        }

        .hint {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 300;
            pointer-events: none;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 18px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        @media (max-width: 640px) {
            .hint {
                display: none;
            }
            .controls {
                bottom: 18px;
            }
            .controls-left {
                left: 16px;
                gap: 6px;
            }
            .controls-right {
                right: 16px;
            }
            .ctrl-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            .ctrl-btn.zoom-in,
            .ctrl-btn.zoom-out {
                font-size: 20px;
            }
        }

        @media (max-width: 420px) {
            .ctrl-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            .ctrl-btn.zoom-in,
            .ctrl-btn.zoom-out {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div class="envelope-wrapper" id="envelopeWrapper">
            <div class="envelope-glow"></div>
            <div class="envelope">
                <div class="envelope-flap"></div>
                <div class="envelope-body">
                    <div class="heart-seal">❤️</div>
                    <div class="letter-content">
                        <div class="salutation">
                            <strong>💌 Untukmu yang terkasih...</strong>
                        </div>
                        <div class="divider"></div>
                        <div class="sub-line">Dari seseorang yang mencintaimu</div>
                    </div>
                </div>
                <div class="envelope-corner tl"></div>
                <div class="envelope-corner tr"></div>
                <div class="envelope-corner bl"></div>
                <div class="envelope-corner br"></div>
            </div>
            <div class="click-hint">Happy Birthday My Girl</div>
        </div>
    </div>

    <audio id="audio" loop preload="metadata">
        <source src="glue.mp3" type="audio/mpeg" />
    </audio>

    <!-- Fallback intro handler: amplop tetap bisa dibuka meskipun Three.js gagal dimuat. -->
    <script>
        (() => {
            const overlay = document.getElementById('intro-overlay');
            const wrapper = document.getElementById('envelopeWrapper');
            const audio = document.getElementById('audio');
            let opened = false;

            function openEnvelope(e) {
                if (opened) return;
                opened = true;
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                window.__introOpened = true;
                wrapper.classList.add('open');

                // Musik dimulai setelah interaksi pengguna agar sesuai aturan autoplay browser.
                if (audio) audio.play().catch(() => {});

                setTimeout(() => {
                    // Biarkan scene utama melakukan zoom-in setelah amplop terbuka.
                    if (typeof introActive !== 'undefined') {
                        introActive = false;
                    }
                    if (typeof zoomingIn !== 'undefined') {
                        zoomingIn = true;
                    }
                    if (typeof targetDist !== 'undefined') {
                        targetDist = (typeof isMobile !== 'undefined' && isMobile) ? 550 : 300;
                    }

                    overlay.classList.add('hidden');
                    overlay.setAttribute('aria-hidden', 'true');
                }, 1300);
            }

            overlay.addEventListener('pointerup', openEnvelope);
            overlay.addEventListener('touchend', openEnvelope, { passive: false });
        })();
    </script>

    <!-- Zoom Controls (kiri bawah) -->
    <div class="controls controls-left" id="zoomControls">
        <button class="ctrl-btn zoom-in" id="zoomIn" aria-label="Zoom In">＋</button>
        <button class="ctrl-btn zoom-out" id="zoomOut" aria-label="Zoom Out">−</button>
    </div>

    <!-- Play / Pause (kanan bawah) -->
    <div class="controls controls-right">
        <button id="play" class="ctrl-btn" aria-label="Play / Pause">▶️</button>
    </div>

    <div class="hint"> geser · zoom · jelajahi </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play');
        let isPlaying = false;

        async function safePlay() {
            try {
                await audio.play();
                isPlaying = true;
                playBtn.textContent = '⏸️';
            } catch (err) {
                console.log('Audio tidak dapat diputar:', err.message);
                isPlaying = false;
                playBtn.textContent = '▶️';
            }
        }

        function safePause() {
            try {
                audio.pause();
            } catch (_) { /* ignore */ }
            isPlaying = false;
            playBtn.textContent = '▶️';
        }

        playBtn.addEventListener('click', async () => {
            if (isPlaying) {
                safePause();
            } else {
                await safePlay();
            }
        });

        document.addEventListener('click', async () => {
            if (!isPlaying) await safePlay();
        }, { once: true });
        document.addEventListener('touchstart', async () => {
            if (!isPlaying) await safePlay();
        }, { once: true });

        audio.addEventListener('error', () => {
            console.log('File audio tidak ditemukan, melanjutkan tanpa musik.');
        });

        // ─── ZOOM ────────────────────────────────────────────────
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        let targetDist = 4000;

        zoomInBtn.addEventListener('click', () => {
            targetDist = Math.max(80, targetDist - 60);
        });
        zoomOutBtn.addEventListener('click', () => {
            targetDist = Math.min(2500, targetDist + 60);
        });

        // ─── THREE.JS ────────────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5;
        document.body.prepend(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const isMobile = window.innerWidth < window.innerHeight;
        const camera = new THREE.PerspectiveCamera(
            isMobile ? 75 : 60,
            window.innerWidth / window.innerHeight,
            0.1,
            8000
        );
        camera.position.set(0, 0, 4000);

        let introActive = !window.__introOpened;
        let zoomingIn = false;
        let currentDist = 4000;
        let rotX = 0.3;
        let rotY = 0;
        let dragging = false;
        let lastX = 0,
            lastY = 0;
        let pinchDist = 0;

        // ─── TEXTURE HELPERS ─────────────────────────────────────
        function makeGlowTexture(size = 512, color1 = '255,255,255', color2 = '150,0,255') {
            const c = document.createElement('canvas');
            c.width = c.height = size;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(size / 2, size / 2, 0.05 * size, size / 2, size / 2, 0.5 * size);
            grad.addColorStop(0, `rgba(${color1},0.9)`);
            grad.addColorStop(0.5, `rgba(${color2},0.4)`);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(c);
        }

        // === TEXTURE TEXT: anti-terpotong / anti-terpangkas ===
        // Canvas dibuat berdasarkan ukuran teks, lalu sprite memakai aspect ratio
        // canvas. Jadi kata panjang seperti "Jaga Kesehatan Ya Cantik" tetap utuh.
        function makeTextTexture(text, color = '#ffffff') {
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');

            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const fontFamily = '"Segoe UI", "Arial", sans-serif';
            const fontWeight = '700';
            const maxFontSize = 90;
            const minFontSize = 22;

            let fontSize = maxFontSize;
            ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;

            // Ukur teks terlebih dahulu. Emoji juga ikut dihitung oleh canvas.
            let metrics = ctx.measureText(text);
            let textWidth = metrics.width;

            // Ruang aman untuk shadow + outline supaya ujung huruf tidak terpotong.
            const horizontalPadding = 80;
            const verticalPadding = 70;

            // Canvas lebar, tetapi tetap dinamis terhadap teks.
            // Tidak ada clipping karena canvas mengikuti hasil pengukuran.
            while (textWidth > 1900 && fontSize > minFontSize) {
                fontSize -= 2;
                ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
                metrics = ctx.measureText(text);
                textWidth = metrics.width;
            }

            // Ambil bounding box aktual font supaya bagian atas/bawah huruf aman.
            const ascent = Math.abs(metrics.actualBoundingBoxAscent || fontSize * 0.8);
            const descent = Math.abs(metrics.actualBoundingBoxDescent || fontSize * 0.25);

            const cssWidth = Math.ceil(textWidth + horizontalPadding);
            const cssHeight = Math.ceil(ascent + descent + verticalPadding);

            c.width = Math.max(256, Math.ceil(cssWidth * dpr));
            c.height = Math.max(96, Math.ceil(cssHeight * dpr));

            // Setelah resize canvas, context kehilangan font/style sebelumnya.
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const x = cssWidth / 2;
            const y = cssHeight / 2;

            // ===== TEXT GLOW =====
            // Beberapa lapisan glow membuat teks terlihat benar-benar bercahaya.
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Halo lembut yang menyebar jauh.
            ctx.save();
            ctx.shadowColor = color;
            ctx.shadowBlur = 42;
            ctx.globalAlpha = 0.55;
            ctx.fillStyle = color;
            ctx.fillText(text, x, y);
            ctx.restore();

            // Inti glow yang lebih kuat.
            ctx.save();
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
            ctx.globalAlpha = 0.95;
            ctx.fillStyle = color;
            ctx.fillText(text, x, y);
            ctx.restore();

            // Highlight putih tipis agar huruf terasa menyala.
            ctx.save();
            ctx.shadowColor = color;
            ctx.shadowBlur = 8;
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, x, y);
            ctx.restore();

            // Sedikit warna asli di atas highlight.
            ctx.save();
            ctx.globalAlpha = 0.82;
            ctx.fillStyle = color;
            ctx.fillText(text, x, y);
            ctx.restore();

            const texture = new THREE.CanvasTexture(c);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.needsUpdate = true;

            // Simpan rasio asli canvas agar Sprite tidak memaksa teks menjadi gepeng
            // dan seluruh area tekstur tetap terlihat.
            texture.userData = {
                textWidth: cssWidth,
                textHeight: cssHeight,
                aspect: cssWidth / cssHeight
            };

            return texture;
        }

        function makeHeartTexture(hexColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 64, 64);
            const color = new THREE.Color(hexColor);
            ctx.fillStyle = `rgb(${color.r*255|0},${color.g*255|0},${color.b*255|0})`;
            const x = 32,
                y = 32,
                s = 14;
            ctx.beginPath();
            ctx.moveTo(x, y + s / 3);
            ctx.bezierCurveTo(x, y - s / 2, x - s, y - s, x - s, y - s / 3);
            ctx.bezierCurveTo(x - s, y + s / 3, x, y + s, x, y + s);
            ctx.bezierCurveTo(x, y + s, x + s, y + s / 3, x + s, y - s / 3);
            ctx.bezierCurveTo(x + s, y - s, x, y - s / 2, x, y + s / 3);
            ctx.closePath();
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

            const scale = 1.0;
            const x2 = x / scale;

            const z2 = z / scale;
            const a = x2 * x2 + (9 / 4) * y2 * y2 + z2 * z2 - 1;
            const b = a * a * a - x2 * x2 * z2 * z2 * z2 - (9 / 80) * y2 * y2 * z2 * z2 * z2;
            return b <= 0;
        }

                        y: y + (Math.random() - 0.5) * noise,

        function makeGasTexture(r, g, b) {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 128;
            const ctx = c.getContext('2d');
            for (let i = 0; i < c.height; i++) {
                const mix = (Math.sin(i * 0.1) + 1) / 2;
                const r2 = r * mix + 50 * (1 - mix);
                const g2 = g * mix + 50 * (1 - mix);
                const b2 = b * mix + 50 * (1 - mix);
                ctx.fillStyle = `rgb(${r2|0},${g2|0},${b2|0})`;
                ctx.fillRect(0, i, c.width, 1);
            }
            return new THREE.CanvasTexture(c);
        }

        function makeRockyTexture(r1, g1, b1, r2, g2, b2) {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 128;
            const ctx = c.getContext('2d');
            for (let y = 0; y < c.height; y += 4) {
                for (let x = 0; x < c.width; x += 4) {
                    const mix = Math.random();
                    const r = r1 * mix + r2 * (1 - mix);
                    const g = g1 * mix + g2 * (1 - mix);
                    const b = b1 * mix + b2 * (1 - mix);
                    ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
                    ctx.fillRect(x, y, 4, 4);
                }
            }
            return new THREE.CanvasTexture(c);
        }

        const comets = new THREE.Group();
        scene.add(comets);
        const cometHeadTex = makeGlowTexture(128, '255,255,255', '150,200,255');

        function resetComet(comet) {
            const startRadius = 600 + Math.random() * 400;
            const angle = Math.random() * Math.PI * 2;
            const height = (Math.random() - 0.5) * 600;
            comet.position.set(
                startRadius * Math.cos(angle),
                height,
                startRadius * Math.sin(angle)
            );
            const target = new THREE.Vector3(
                (Math.random() - 0.5) * 200,
                (Math.random() - 0.5) * 200,
                (Math.random() - 0.5) * 200
            );
            const dir = target.clone().sub(comet.position).normalize();
            const speed = 4 + Math.random() * 4;
            comet.userData.velocity = dir.multiplyScalar(speed);
            comet.userData.life = 0;
            comet.userData.maxLife = 150 + Math.random() * 150;
            comet.userData.history = [];
            for (let i = 0; i < 30; i++) {
                comet.userData.history.push(comet.position.clone());
            }
        }

        for (let i = 0; i < 8; i++) {
            const group = new THREE.Group();
            const head = new THREE.Sprite(
                new THREE.SpriteMaterial({ map: cometHeadTex, transparent: true, opacity: 0.9 })
            );
            head.scale.set(30, 30, 1);
            group.add(head);

            const tailGeo = new THREE.BufferGeometry();
            const tailPos = new Float32Array(30 * 3);
            const tailCol = new Float32Array(30 * 3);
            for (let j = 0; j < 30; j++) {
                const opacity = 1 - (j / 30);
                tailCol[j * 3] = opacity;
                tailCol[j * 3 + 1] = opacity * 0.8 + 0.2;
                tailCol[j * 3 + 2] = 1.0;
            }
            tailGeo.setAttribute('position', new THREE.BufferAttribute(tailPos, 3));
            tailGeo.setAttribute('color', new THREE.BufferAttribute(tailCol, 3));
            const tailMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.6 });
            const tail = new THREE.Line(tailGeo, tailMat);
            group.add(tail);

            group.userData.history = [];
            resetComet(group);
            comets.add(group);
        }

        // ─── LITTLE HEARTS ──────────────────────────────────────
        const littleHearts = new THREE.Group();
        scene.add(littleHearts);

        const heartHexColors = [
            0xff4466, 0xff6699, 0xff88aa, 0xcc44ff, 0xaa66ff,
            0xffaa88, 0xffcc66, 0xff99cc, 0xdd66ff, 0xff77bb,
            0xee55aa, 0xff3366, 0xff66aa, 0xff4488, 0xcc88ff
        ];

        for (let i = 0; i < 80; i++) {
            const color = heartHexColors[Math.floor(Math.random() * heartHexColors.length)];
            const tex = makeHeartTexture(color);
            const mat = new THREE.SpriteMaterial({
                map: tex,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                opacity: 0.8 + Math.random() * 0.2
            });
            const sprite = new THREE.Sprite(mat);
            const size = 3 + Math.random() * 8;
            sprite.scale.set(size, size, 1);

            const radius = 80 + Math.random() * 400;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            sprite.position.set(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );

            sprite.userData = {
                radius,
                theta,
                phi,
                speed: 0.001 + Math.random() * 0.002,
                rotSpeed: (Math.random() - 0.5) * 0.02,
            };
            littleHearts.add(sprite);
        }

        // ─── LIGHTING ────────────────────────────────────────────
        scene.add(new THREE.AmbientLight(0x666688, 1.2));
        const light = new THREE.PointLight(0xffeedd, 2.5, 3000);
        scene.add(light);
        const loveLight = new THREE.PointLight(0xff4488, 2.0, 600);
        loveLight.position.set(0, 0, 0);
        scene.add(loveLight);

        // ─── INTRO ──────────────────────────────────────────────
        const overlay = document.getElementById('intro-overlay');
        const wrapper = document.getElementById('envelopeWrapper');
        let isAnimating = false;

        function dismissIntro() {
            if (!introActive || isAnimating) return;
            isAnimating = true;

            wrapper.classList.add('open');

            setTimeout(() => {
                introActive = false;
                zoomingIn = true;
                currentDist = 4000;
                targetDist = isMobile ? 550 : 300;
                overlay.classList.add('hidden');
                safePlay();
                isAnimating = false;
            }, 1300);
        }

        overlay.addEventListener('click', dismissIntro);
        overlay.addEventListener('touchstart', dismissIntro, { once: true });

        // ─── CONTROLS ────────────────────────────────────────────
        function onPointerDown(e) {
            if (introActive) return;
            dragging = true;
            const p = e.touches ? e.touches[0] : e;
            lastX = p.clientX;
            lastY = p.clientY;
        }

        function onPointerMove(e) {
            if (!dragging || introActive) return;
            const p = e.touches ? e.touches[0] : e;
            const dx = (p.clientX - lastX) / window.innerWidth;
            const dy = (p.clientY - lastY) / window.innerHeight;
            rotY -= 3 * dx;
            rotX = Math.max(-1.5, Math.min(1.5, rotX - 2.2 * dy));
            lastX = p.clientX;
            lastY = p.clientY;
        }

        function onPointerUp() { dragging = false; }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp, { passive: true });

        window.addEventListener('wheel', (e) => {
            if (introActive) return;
            targetDist += 0.5 * e.deltaY;
            targetDist = Math.max(80, Math.min(2500, targetDist));
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (introActive || !e.touches || e.touches.length !== 2) return;
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            if (pinchDist) {
                targetDist += 1.0 * (pinchDist - dist);
                targetDist = Math.max(80, Math.min(2500, targetDist));
            }
            pinchDist = dist;
        }, { passive: true });
        window.addEventListener('touchend', () => { pinchDist = 0; }, { passive: true });

        window.addEventListener('resize', () => {
            const mob = window.innerWidth < window.innerHeight;
            camera.fov = mob ? 75 : 60;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (currentDist < 2000) targetDist = mob ? 550 : 300;
        });

        // ─── ANIMATION LOOP ──────────────────────────────────────
        let t = 0;

        function animate() {
            requestAnimationFrame(animate);
            t += 0.01;

            const pulse = 1 + 0.04 * Math.sin(t * 1.2);
            lovePlanetGroup.scale.set(pulse, pulse, pulse);

            lovePlanetGroup.rotation.x = 0;
            lovePlanetGroup.rotation.y = 0;
            lovePlanetGroup.rotation.z = 0;
            heartMat.size = 0.4;
            glowSprite.material.opacity = 0.7 + 0.1 * Math.sin(t * 1.5);
            glowSprite2.material.opacity = 0.35 + 0.1 * Math.sin(t * 1.2 + 0.5);
            dustPoints.rotation.y = t * 0.02;

            galaxyRingGroup.rotation.y += 0.0006;

            for (let i = 0; i < starMaterials.length; i++) {
                const speed = 0.08 + i * 0.03;
                const phase = i * 1.5 + 0.7;
                const val = Math.sin(t * speed + phase);
                starMaterials[i].opacity = 0.3 + 0.65 * (val * 0.5 + 0.5);
            }

            comets.children.forEach((comet) => {
                comet.position.add(comet.userData.velocity);
                comet.userData.life++;
                comet.userData.history.unshift(comet.position.clone());
                comet.userData.history.pop();

                const tailGeo2 = comet.children[1].geometry;
                const tailPos2 = tailGeo2.attributes.position.array;
                for (let i = 0; i < 30; i++) {
                    const pt = comet.userData.history[i];
                    tailPos2[3 * i] = pt.x - comet.position.x;
                    tailPos2[3 * i + 1] = pt.y - comet.position.y;
                    tailPos2[3 * i + 2] = pt.z - comet.position.z;
                }
                tailGeo2.attributes.position.needsUpdate = true;

                if (comet.userData.life > comet.userData.maxLife) {
                    resetComet(comet);
                } else {
                    const progress = comet.userData.life / comet.userData.maxLife;
                    const opacity = 1 - Math.pow(progress, 3);
                    comet.children[0].material.opacity = opacity;
                    comet.children[1].material.opacity = opacity * 0.6;
                }
            });

            planets.children.forEach((p) => {
                p.userData.theta += p.userData.speed;
                p.position.x = p.userData.radius * Math.sin(p.userData.phi) * Math.cos(p.userData.theta);
                p.position.z = p.userData.radius * Math.sin(p.userData.phi) * Math.sin(p.userData.theta);
                if (p.type === 'Mesh') {
                    p.rotation.y += 0.01;
                } else {
                    p.children[0].rotation.y += 0.01;
                    if (p.children.length > 1) p.children[1].rotation.z -= 0.02;
                }
            });

            littleHearts.children.forEach((sprite) => {
                sprite.userData.theta += sprite.userData.speed;
                sprite.position.x = sprite.userData.radius * Math.sin(sprite.userData.phi) * Math.cos(sprite
                    .userData.theta);
                sprite.position.z = sprite.userData.radius * Math.sin(sprite.userData.phi) * Math.sin(sprite
                    .userData.theta);
                const s = 3 + Math.random() * 8;
                const pulse2 = 0.8 + 0.2 * Math.sin(t * 2 + sprite.id);
                sprite.scale.set(s * pulse2, s * pulse2, 1);
                sprite.material.opacity = 0.7 + 0.3 * Math.sin(t * 1.5 + sprite.id * 0.5);
            });

            // Floating words: gerak & opacity
            textGroup.children.forEach((sprite) => {
                sprite.material.opacity = 0.85 + 0.15 * Math.sin(2 * t + sprite.id);
                sprite.userData.theta += sprite.userData.speed;
                sprite.position.x = sprite.userData.radius * Math.sin(sprite.userData.phi) * Math.cos(sprite
                    .userData.theta);
                sprite.position.z = sprite.userData.radius * Math.sin(sprite.userData.phi) * Math.sin(sprite
                    .userData.theta);
            });

            // Happy Birthday text berdenyut pelan
            const scalePulse = 1 + 0.04 * Math.sin(t * 0.8);
            textSprite.scale.set(120 * scalePulse, 30 * scalePulse, 1);
            textSprite.material.opacity = 0.9 + 0.1 * Math.sin(t * 1.1);

            if (zoomingIn) {
                currentDist += 0.004 * (targetDist - currentDist);
                rotY += 0.0008;
                if (Math.abs(currentDist - targetDist) < 5) zoomingIn = false;
            } else if (!introActive) {
                currentDist += 0.04 * (targetDist - currentDist);
            }

            const cx = Math.cos(rotX),
                sx = Math.sin(rotX);
            const cy = Math.cos(rotY),
                sy = Math.sin(rotY);
            camera.position.set(
                currentDist * sy * cx,
                currentDist * sx,
                currentDist * cy * cx
            );
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();

        console.log('🎉 Happy Birthday! 🎂');
    </script>
</body>
</html>
